server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name markt.digitalisierungsplanung.de;

    ssl_certificate     /etc/letsencrypt/live/markt.digitalisierungsplanung.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markt.digitalisierungsplanung.de/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 600k;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name markt.digitalisierungsplanung.de;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
