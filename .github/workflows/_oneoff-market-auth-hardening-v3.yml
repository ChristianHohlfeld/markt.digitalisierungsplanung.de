name: One-off market auth hardening v3
on:
  push:
    paths:
      - .github/workflows/_oneoff-market-auth-hardening-v3.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Require same-site browser mutations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js'); t=p.read_text()
          old='function originOk(req,res){const origin=req.headers.origin;if(origin&&origin!==PUBLIC_ORIGIN){send(res,403,{error:"forbidden_origin"});return false;}return true;}'
          new='function originOk(req,res){const origin=req.headers.origin,site=String(req.headers["sec-fetch-site"]||"").toLowerCase();if((origin&&origin!==PUBLIC_ORIGIN)||site==="cross-site"){send(res,403,{error:"forbidden_origin"});return false;}return true;}'
          if t.count(old)!=1: raise SystemExit('originOk not found')
          p.write_text(t.replace(old,new,1))
          p=Path('tests/ui.test.js'); t=p.read_text()
          anchor='  assert.match(server, /"cache-control":"no-store"/);\n'
          add=anchor+'  assert.match(server, /sec-fetch-site/);\n'
          if t.count(anchor)!=1: raise SystemExit('security test anchor not found')
          p.write_text(t.replace(anchor,add,1))
          Path('.github/workflows/_oneoff-market-auth-hardening-v3.yml').unlink()
          PY
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject cross-site market mutations"
          git push origin HEAD:main
