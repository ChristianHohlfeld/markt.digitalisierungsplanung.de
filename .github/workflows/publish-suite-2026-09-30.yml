name: Publish suite-2026-09-30
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-suite-2026-09-30.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=suite-2026-09-30
          SHA=$(git rev-parse HEAD)
          if gh release view "$TAG" >/dev/null 2>&1; then echo exists; exit 0; fi
          gh release create "$TAG" --target "$SHA" \
            --title "Digitalisierungsplanung Suite 2026-09-30 — Markt" \
            --notes "# Suite 2026-09-30

Markt commit \`$SHA\`."
